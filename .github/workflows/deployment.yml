name: Deployment gate and GHCR release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GHCR images after every fast gate passes
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  release:
    uses: ./.github/workflows/fast-gate.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
