name: Deployment artifacts
on:
  workflow_dispatch:
  push:
    branches: ["deployment/**"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: /__w/llm-auth-bridge/llm-auth-bridge
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.22"

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian runner tools
        run: apt-get update && apt-get install -y ca-certificates curl git tar

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate frontend and non-browser backend
        timeout-minutes: 8
        env: {BRIDGE_TEST_GOST: /tmp/gost}
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-logs
          git rev-parse HEAD > deployment-logs/source-revision.txt
          git status --porcelain=v1 -- . ':!deployment-logs' > deployment-logs/uncommitted-inputs.txt
          printf 'run=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" > deployment-logs/environment.txt
          exec > deployment-logs/validation.log 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > deployment-logs/validation.exit' EXIT
          curl -fsSL https://github.com/go-gost/gost/releases/download/v3.3.1/gost_3.3.1_linux_amd64.tar.gz -o /tmp/gost.tar.gz
          echo 'e0e3a2c9116e2f025e962bba340749f80696bda318613d45e5ae96dd0bcae37c  /tmp/gost.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gost.tar.gz -C /tmp gost
          uv sync --frozen --extra test --extra browser
          npm ci --ignore-scripts --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          timeout --signal=TERM --kill-after=15s 5m uv run pytest -v -ra -o faulthandler_timeout=120 --ignore=tests/test_browser_live.py --ignore=tests/test_monitor_live.py --ignore=tests/test_novnc_live.py --ignore=tests/test_takeover_live.py --ignore=tests/test_ui_live.py --ignore=tests/test_proxy_live.py --junitxml=deployment-logs/pytest-nonbrowser.xml > deployment-logs/pytest-nonbrowser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-validation-${{ github.sha }}
          path: deployment-logs/
          retention-days: 7

  browser_acceptance:
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian runner tools
        run: apt-get update && apt-get install -y ca-certificates curl git tar

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for packaged noVNC acceptance
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --prefix frontend
          npm run build --prefix frontend
      - name: Install Python and browser dependencies
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          uv sync --frozen --extra test --extra browser
          uv run playwright install --with-deps chromium
          apt-get update
          apt-get install -y xvfb xauth novnc x11vnc websockify tigervnc-standalone-server openbox x11-utils
      - name: Run bounded headed acceptance
        timeout-minutes: 8
        env: {BRIDGE_TEST_GOST: /tmp/gost}
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-browser-logs
          git rev-parse HEAD > deployment-browser-logs/source-revision.txt
          printf 'run=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" > deployment-browser-logs/environment.txt
          exec > deployment-browser-logs/browser.log 2>&1
          trap 'rc=$?; pkill -TERM -P $$ 2>/dev/null || true; printf "%s\n" "$rc" > deployment-browser-logs/browser.exit' EXIT
          curl -fsSL https://github.com/go-gost/gost/releases/download/v3.3.1/gost_3.3.1_linux_amd64.tar.gz -o /tmp/gost.tar.gz
          echo 'e0e3a2c9116e2f025e962bba340749f80696bda318613d45e5ae96dd0bcae37c  /tmp/gost.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gost.tar.gz -C /tmp gost
          timeout --signal=TERM --kill-after=15s 6m xvfb-run -a -s '-screen 0 1920x1080x24' uv run pytest -v -ra tests/test_browser_live.py tests/test_monitor_live.py tests/test_novnc_live.py -k 'headed_native_device or codex_existing or monitor or novnc' --junitxml=deployment-browser-logs/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-browser-${{ github.sha }}
          path: deployment-browser-logs/
          retention-days: 7

  images:
    needs: [validate, browser_acceptance]
    if: needs.validate.result == 'success' && needs.browser_acceptance.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native ARM64 app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/arm64
          load: true
          tags: llm-auth-bridge-app:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bridge-deployment-arm64-app
          cache-to: type=gha,scope=bridge-deployment-arm64-app,mode=max
      - name: Build native ARM64 worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/arm64
          load: true
          tags: llm-auth-bridge-worker:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bridge-deployment-arm64-worker
          cache-to: type=gha,scope=bridge-deployment-arm64-worker,mode=max
      - name: Verify resizable desktop in the production ARM64 worker
        timeout-minutes: 3
        run: |
          set -euo pipefail
          docker run --rm --shm-size=1g --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --security-opt no-new-privileges:true --security-opt seccomp=deploy/playwright-seccomp.json \
            -e PYTHONPATH=/app -v "$PWD/tests/native_desktop_probe.py:/acceptance/native_desktop_probe.py:ro" \
            --entrypoint python "llm-auth-bridge-worker:$GITHUB_SHA" /acceptance/native_desktop_probe.py
      - name: Verify and export native ARM64 deployment images
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-images
          exec > deployment-images/build.log 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > deployment-images/build.exit' EXIT
          git rev-parse HEAD > deployment-images/source-revision.txt
          printf 'run=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" > deployment-images/environment.txt
          docker image inspect "llm-auth-bridge-app:$GITHUB_SHA" "llm-auth-bridge-worker:$GITHUB_SHA" --format '{{.Id}} {{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}' > deployment-images/image-identities.txt
          test "$(wc -l < deployment-images/image-identities.txt)" -eq 2
          test "$(awk '$2 == "arm64" && $3 == ENVIRON["GITHUB_SHA"] {count++} END {print count+0}' deployment-images/image-identities.txt)" -eq 2
          docker save "llm-auth-bridge-app:$GITHUB_SHA" "llm-auth-bridge-worker:$GITHUB_SHA" | gzip -1 > deployment-images/images.tar.gz
          (cd deployment-images && sha256sum images.tar.gz > images.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-arm64-${{ github.sha }}
          path: deployment-images/
          compression-level: 0
          retention-days: 2
