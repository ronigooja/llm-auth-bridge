name: Browser identity diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic scope
        type: choice
        default: browser
        options: [browser, contracts]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra test --extra browser
      - if: inputs.mode == 'browser'
        run: uv run python -m camoufox fetch
      - name: Provision headed sandboxed synthetic runtime
        if: inputs.mode == 'browser'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check identity and external diagnostic without account state
        if: inputs.mode == 'browser'
        env:
          BRIDGE_BROWSERLEAKS_CHECK: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' uv run pytest -v -ra tests/test_browser_identity_live.py
      - name: Check identity API, migration and browser lifecycle contracts
        if: inputs.mode == 'contracts'
        run: uv run pytest -v -ra tests/test_browser_identity.py tests/test_browser.py tests/test_cpa_oauth.py
