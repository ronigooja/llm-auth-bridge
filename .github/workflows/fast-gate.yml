name: Fast deployment gate

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GHCR images after every fast gate passes
        type: boolean
        default: false
  push:
    branches: [main, "validation/**", "deployment/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.22"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        working-directory: frontend
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/fast-gate-logs"
          exec > "$GITHUB_WORKSPACE/fast-gate-logs/frontend.log" 2>&1
          npm ci --ignore-scripts
          timeout --signal=TERM --kill-after=15s 3m npm test
          timeout --signal=TERM --kill-after=15s 4m npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-gate-frontend-${{ github.sha }}
          path: fast-gate-logs/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Provision synthetic backend tests
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          mkdir -p fast-gate-logs
          exec > fast-gate-logs/provision.log 2>&1
          uv sync --frozen --extra test --extra browser
      - name: Set up cached synthetic proxy
        timeout-minutes: 4
        uses: ./.github/actions/setup-gost
      - name: Run non-browser pytest gate
        timeout-minutes: 7
        run: |
          set -Eeuo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 5m bash -o pipefail -c \
            'uv run python -m pytest -p tools.pytest_deadline -x -v -ra -o faulthandler_timeout=60 \
              --ignore-glob="tests/*_live.py" \
              --junitxml=fast-gate-logs/pytest-nonbrowser.xml > fast-gate-logs/pytest-nonbrowser.log 2>&1'
          result=$?
          printf '%s\n' "$result" > fast-gate-logs/pytest-nonbrowser.exit
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-gate-backend-${{ github.sha }}
          path: fast-gate-logs/
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install browser dependencies
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          mkdir -p fast-gate-logs
          exec > fast-gate-logs/browser-provision.log 2>&1
          uv sync --frozen --extra test --extra browser
      - uses: ./.github/actions/setup-camoufox
      - name: Install display prerequisites
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run synthetic browser preflight
        timeout-minutes: 5
        env: {BRIDGE_TEST_GOST: /tmp/gost}
        run: |
          set -Eeuo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 3m xvfb-run -a -s '-screen 0 1280x720x24' \
            uv run python -m pytest -p tools.pytest_deadline -x -v -ra tests/test_browser_live.py -k 'real_camoufox_detects_and_submits_synthetic_login or codex_existing' \
            --junitxml=fast-gate-logs/browser.xml > fast-gate-logs/browser.log 2>&1
          result=$?
          printf '%s\n' "$result" > fast-gate-logs/browser.exit
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-gate-browser-${{ github.sha }}
          path: fast-gate-logs/
          retention-days: 7

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        timeout-minutes: 8
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          load: true
          tags: llm-auth-bridge-app:${{ github.sha }}
          cache-from: type=gha,scope=fast-gate-app
          cache-to: type=gha,scope=fast-gate-app,mode=max
      - name: Build worker image
        timeout-minutes: 12
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          load: true
          tags: llm-auth-bridge-worker:${{ github.sha }}
          cache-from: type=gha,scope=fast-gate-worker
          cache-to: type=gha,scope=fast-gate-worker,mode=max
      - name: Verify non-root worker, seccomp, and readyz
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          mkdir -p fast-gate-logs
          docker run --rm --security-opt no-new-privileges:true \
            --security-opt seccomp=deploy/playwright-seccomp.json \
            --entrypoint sh llm-auth-bridge-worker:${GITHUB_SHA} -c 'test "$(id -u)" -eq 10001'
          python3 -c 'from pathlib import Path; Path("/tmp/fast-gate-master-key").write_bytes(b"x" * 32)'
          mkdir -p .secrets
          cp /tmp/fast-gate-master-key .secrets/master_key
          cat > /tmp/fast-gate-compose.yml <<EOF
          services:
            app:
              image: llm-auth-bridge-app:${GITHUB_SHA}
            worker:
              image: llm-auth-bridge-worker:${GITHUB_SHA}
          EOF
          export COMPOSE_FILE="$PWD/docker-compose.yml:/tmp/fast-gate-compose.yml"
          cleanup() {
            result=$?
            docker compose logs --no-color --tail 100 > fast-gate-logs/containers.log 2>&1 || true
            docker compose ps --format json > fast-gate-logs/compose.json || true
            docker compose down -v >> fast-gate-logs/containers.log 2>&1 || true
            rm -f /tmp/fast-gate-master-key /tmp/fast-gate-compose.yml .secrets/master_key
            exit "$result"
          }
          trap cleanup EXIT
          exec > fast-gate-logs/startup.log 2>&1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker compose run --rm --no-deps --entrypoint sh app -c \
            'printf "%s\n" synthetic-password > /tmp/password; python -m app.cli init --password-file /tmp/password'
          docker compose up -d --no-build --wait --wait-timeout 120
          timeout --signal=TERM --kill-after=15s 3m bash -c \
            'until curl -fsS http://127.0.0.1:8000/readyz; do sleep 2; done'
          docker run --rm --security-opt seccomp=deploy/playwright-seccomp.json \
            --entrypoint python llm-auth-bridge-worker:${GITHUB_SHA} -c \
            'from camoufox.sync_api import Camoufox; b=Camoufox(headless=True); browser=b.__enter__(); page=browser.new_page(); page.set_content("<p>synthetic</p>"); assert page.locator("p").inner_text()=="synthetic"; b.__exit__(None,None,None)'
          docker compose ps
          docker compose ps --format json > fast-gate-logs/compose.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-gate-containers-${{ github.sha }}
          path: fast-gate-logs/
          retention-days: 7

  publish:
    needs: [frontend, backend, browser, containers]
    if: ${{ inputs.publish && needs.frontend.result == 'success' && needs.backend.result == 'success' && needs.browser.result == 'success' && needs.containers.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable app image
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-app:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fast-gate-app
          cache-to: type=gha,scope=fast-gate-app,mode=max
      - name: Publish immutable worker image
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fast-gate-worker
          cache-to: type=gha,scope=fast-gate-worker,mode=max
      - name: Record immutable digests for deployment
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "app=ghcr.io/${GITHUB_REPOSITORY}-app@${{ steps.app.outputs.digest }}"
            echo "worker=ghcr.io/${GITHUB_REPOSITORY}-worker@${{ steps.worker.outputs.digest }}"
          } | tee image-digests.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fast-gate-image-digests-${{ github.sha }}
          path: image-digests.txt
          retention-days: 30
