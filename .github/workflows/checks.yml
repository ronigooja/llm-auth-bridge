name: Checks
on:
  push:
    branches-ignore: ["validation/**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install uv==0.8.22
      - run: uv sync --frozen --extra test --extra browser
      - run: uv run playwright install --with-deps chromium
      - name: Enable Chromium sandbox namespaces on ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install checksum-verified synthetic proxy test executable
        run: |
          curl -fsSL https://github.com/go-gost/gost/releases/download/v3.3.1/gost_3.3.1_linux_amd64.tar.gz -o /tmp/gost.tar.gz
          echo 'e0e3a2c9116e2f025e962bba340749f80696bda318613d45e5ae96dd0bcae37c  /tmp/gost.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gost.tar.gz -C /tmp gost
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run pytest
        env:
          BRIDGE_TEST_GOST: /tmp/gost
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [app, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
