name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "AGENTS.md"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          has_path() { grep -Eq "$1" <<<"$changed"; }
           echo "images=$(has_path '^(app/|frontend/|deploy/|Dockerfile|docker-compose|pyproject.toml$|uv.lock$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
  images:
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        target: [app, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=bridge-checks-${{ matrix.target }}
          cache-to: type=gha,scope=bridge-checks-${{ matrix.target }},mode=max
