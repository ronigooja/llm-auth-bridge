name: Checks
on:
  push:
    branches-ignore: ["validation/**", "deployment/**", "artifacts/**"]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: /__w/llm-auth-bridge/llm-auth-bridge
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian runner tools
        run: apt-get update && apt-get install -y ca-certificates curl git tar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra test --extra browser
      - name: Restore Playwright browser binaries
        id: playwright_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('uv.lock') }}
      - name: Install Chromium and required OS packages
        id: playwright_install
        timeout-minutes: 5
        run: uv run playwright install --with-deps chromium
      - name: Save installed Playwright browser binaries before tests
        if: ${{ steps.playwright_cache.outputs.cache-hit != 'true' && steps.playwright_install.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright_cache.outputs.cache-primary-key }}
      - name: Install checksum-verified synthetic proxy test executable
        run: |
          curl -fsSL https://github.com/go-gost/gost/releases/download/v3.3.1/gost_3.3.1_linux_amd64.tar.gz -o /tmp/gost.tar.gz
          echo 'e0e3a2c9116e2f025e962bba340749f80696bda318613d45e5ae96dd0bcae37c  /tmp/gost.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gost.tar.gz -C /tmp gost
      - id: frontend_deps
        run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - if: ${{ !cancelled() && steps.frontend_deps.outcome == 'success' }}
        run: npm run build
        working-directory: frontend
      - name: Codex continuation preflight
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.frontend_deps.outcome == 'success' }}
        env:
          BRIDGE_TEST_GOST: /tmp/gost
        run: |
          set -euo pipefail
          mkdir -p check-logs
          git rev-parse HEAD > check-logs/source-revision.txt
          git status --porcelain=v1 -- . ':!check-logs' > check-logs/uncommitted-inputs.txt
          printf 'run=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" > check-logs/environment.txt
          apt-get update
          apt-get install -y xvfb xauth novnc x11vnc websockify tigervnc-standalone-server openbox x11-utils
          set +e
          timeout --kill-after=10s 180s bash -o pipefail -c 'uv run pytest -v -ra tests/test_browser_live.py -k codex_existing --junitxml=check-logs/codex.xml 2>&1 | tee check-logs/codex.log'
          targeted_result=$?
          printf '%s\n' "$targeted_result" > check-logs/codex.exit
          exit "$targeted_result"
      - name: Save Codex continuation result before full suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-preflight-${{ github.sha }}
          path: check-logs/
          retention-days: 7
      - name: Full pytest acceptance after Codex preflight
        timeout-minutes: 8
        env:
          BRIDGE_TEST_GOST: /tmp/gost
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=10s 7m bash -o pipefail -c 'xvfb-run -a -s "-screen 0 1920x1080x24" uv run pytest -v -ra -o faulthandler_timeout=120 --junitxml=check-logs/pytest.xml 2>&1 | tee check-logs/pytest.log'
          result=$?
          printf '%s\n' "$result" > check-logs/pytest.exit
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ github.sha }}
          path: check-logs/
          retention-days: 7
  images:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        target: [app, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=bridge-checks-${{ matrix.target }}
          cache-to: type=gha,scope=bridge-checks-${{ matrix.target }},mode=max
