name: Build amd64 deployment images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          load: true
          tags: llm-auth-bridge-app:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build amd64 worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          load: true
          tags: llm-auth-bridge-worker:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify nonroot browser startup in production image
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --security-opt seccomp=deploy/playwright-seccomp.json \
            --entrypoint sh "llm-auth-bridge-worker:${GITHUB_SHA}" -c '
              set -e
              Xtigervnc :99 -geometry 1920x1080 -depth 24 -localhost -SecurityTypes None -nolisten tcp > /tmp/display.log 2>&1 &
              trap "kill $! 2>/dev/null || true" EXIT
              for n in $(seq 1 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
              python -c '\''from camoufox.sync_api import Camoufox
          with Camoufox(headless=False) as browser:
              page = browser.new_page()
              page.set_content("<p>Synthetic browser startup</p>")
              assert page.locator("p").inner_text() == "Synthetic browser startup"
              print("Nonroot Camoufox startup passed")'\''
            ' > /tmp/browser-startup.log 2>&1 || { tail -n 80 /tmp/browser-startup.log; exit 1; }
          rm /tmp/browser-startup.log
      - name: Export images
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-images
          docker image inspect "llm-auth-bridge-app:${GITHUB_SHA}" "llm-auth-bridge-worker:${GITHUB_SHA}" \
            --format '{{.Id}} {{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}' \
            > deployment-images/image-identities.txt
          test "$(wc -l < deployment-images/image-identities.txt)" -eq 2
          test "$(awk '$2 == "amd64" && $3 == ENVIRON["GITHUB_SHA"] {count++} END {print count+0}' deployment-images/image-identities.txt)" -eq 2
          docker save "llm-auth-bridge-app:${GITHUB_SHA}" "llm-auth-bridge-worker:${GITHUB_SHA}" \
            | gzip -1 > deployment-images/images.tar.gz
          sha256sum deployment-images/images.tar.gz > deployment-images/images.tar.gz.sha256
          git rev-parse HEAD > deployment-images/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-amd64-${{ github.sha }}
          path: deployment-images/
          compression-level: 0
          retention-days: 2
