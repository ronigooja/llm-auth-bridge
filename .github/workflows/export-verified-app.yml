name: Export verified app image
on:
  push:
    branches: ["artifacts/novnc-app"]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REVISION: 0c8fa8c35b0f768ca4c4395b4e35930f4d9cfc92
    steps:
      - name: Retrieve successful deployment images
        uses: actions/download-artifact@v4
        with:
          name: deployment-arm64-0c8fa8c35b0f768ca4c4395b4e35930f4d9cfc92
          run-id: 40288386352
          github-token: ${{ github.token }}
          path: source-images
      - name: Verify and export only the existing app image
        run: |
          set -Eeuo pipefail
          mkdir -p app-image
          exec > >(tee app-image/export.log) 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > app-image/export.exit' EXIT
          (cd source-images && sha256sum -c images.tar.gz.sha256)
          test "$(cat source-images/source-revision.txt)" = "$SOURCE_REVISION"
          docker load -i source-images/images.tar.gz
          docker image inspect "llm-auth-bridge-app:$SOURCE_REVISION" --format '{{.Id}} {{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}' > app-image/image-identity.txt
          test "$(awk '$2 == "arm64" && $3 == ENVIRON["SOURCE_REVISION"] {count++} END {print count+0}' app-image/image-identity.txt)" -eq 1
          docker save "llm-auth-bridge-app:$SOURCE_REVISION" | gzip -1 > app-image/app.tar.gz
          printf '%s\n' "$SOURCE_REVISION" > app-image/source-revision.txt
          (cd app-image && sha256sum app.tar.gz > app.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-app-0c8fa8c35b0f768ca4c4395b4e35930f4d9cfc92
          path: app-image/
          compression-level: 0
          retention-days: 2
