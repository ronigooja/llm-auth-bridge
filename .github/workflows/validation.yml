name: Native OAuth validation
on:
  workflow_dispatch:
  push:
    branches: ["validation/**"]
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record source and runner
        run: |
          mkdir -p validation-logs
          git rev-parse HEAD > validation-logs/source-revision.txt
          git status --porcelain=v1 > validation-logs/uncommitted-inputs.txt
          printf 'run=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" > validation-logs/environment.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        run: |
          set -euxo pipefail
          exec > >(tee validation-logs/frontend.log) 2>&1
          trap 'printf "%s\n" "$?" > validation-logs/frontend.exit' EXIT
          npm ci --ignore-scripts --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-validation-${{ github.sha }}
          path: validation-logs/
          retention-days: 7
  cpa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record source and runner
        run: |
          mkdir -p validation-logs
          git rev-parse HEAD > validation-logs/source-revision.txt
          git status --porcelain=v1 > validation-logs/uncommitted-inputs.txt
          printf 'run=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" > validation-logs/environment.txt
      - name: Fetch pinned upstream and apply extension
        id: source
        run: |
          set -euxo pipefail
          exec > >(tee validation-logs/source.log) 2>&1
          trap 'printf "%s\n" "$?" > validation-logs/source.exit' EXIT
          revision=$(cat deploy/cpa/UPSTREAM_REVISION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git init /tmp/cpa-source
          git -C /tmp/cpa-source remote add origin https://github.com/router-for-me/CLIProxyAPI.git
          git -C /tmp/cpa-source fetch --depth=1 origin "$revision"
          git -C /tmp/cpa-source checkout --detach FETCH_HEAD
          git -C /tmp/cpa-source rev-parse HEAD > validation-logs/upstream-revision.txt
          (cd deploy/cpa && sha256sum -c upstream.patch.sha256)
          sha256sum deploy/cpa/upstream.patch > validation-logs/upstream-patch.sha256
          git -C /tmp/cpa-source apply --check "$GITHUB_WORKSPACE/deploy/cpa/upstream.patch"
          git -C /tmp/cpa-source apply "$GITHUB_WORKSPACE/deploy/cpa/upstream.patch"
          git -C /tmp/cpa-source diff --stat > validation-logs/upstream-input-changes.txt
      - uses: actions/setup-go@v5
        id: go_setup
        with:
          go-version-file: /tmp/cpa-source/go.mod
          cache-dependency-path: /tmp/cpa-source/go.sum
      - name: Native management synthetic tests
        working-directory: /tmp/cpa-source
        run: |
          set -euxo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/validation-logs/go-management.log") 2>&1
          trap 'printf "%s\n" "$?" > "$GITHUB_WORKSPACE/validation-logs/go-management.exit"' EXIT
          go version
          go test -count=1 ./internal/api/handlers/management ./internal/api
      - name: Full upstream Go suite with extension
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.go_setup.outcome == 'success' }}
        working-directory: /tmp/cpa-source
        run: |
          set -euxo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/validation-logs/go.log") 2>&1
          trap 'printf "%s\n" "$?" > "$GITHUB_WORKSPACE/validation-logs/go.exit"' EXIT
          go test -count=1 ./...
      - name: Compile native executable even after test failure
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.go_setup.outcome == 'success' }}
        working-directory: /tmp/cpa-source
        run: |
          set -euxo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/validation-logs/go-build.log") 2>&1
          trap 'printf "%s\n" "$?" > "$GITHUB_WORKSPACE/validation-logs/go-build.exit"' EXIT
          go build ./cmd/server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpa-validation-${{ github.sha }}
          path: validation-logs/
          retention-days: 7
  cpa-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch untouched pinned upstream baseline
        run: |
          set -euxo pipefail
          mkdir -p validation-logs
          exec > >(tee validation-logs/source.log) 2>&1
          trap 'printf "%s\n" "$?" > validation-logs/source.exit' EXIT
          git rev-parse HEAD > validation-logs/source-revision.txt
          git status --porcelain=v1 > validation-logs/uncommitted-inputs.txt
          printf 'run=%s\njob=%s\nos=%s\narch=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" > validation-logs/environment.txt
          revision=$(cat deploy/cpa/UPSTREAM_REVISION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git init /tmp/cpa-baseline
          git -C /tmp/cpa-baseline remote add origin https://github.com/router-for-me/CLIProxyAPI.git
          git -C /tmp/cpa-baseline fetch --depth=1 origin "$revision"
          git -C /tmp/cpa-baseline checkout --detach FETCH_HEAD
          git -C /tmp/cpa-baseline rev-parse HEAD > validation-logs/upstream-revision.txt
          git -C /tmp/cpa-baseline status --porcelain=v1 > validation-logs/upstream-uncommitted-inputs.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/cpa-baseline/go.mod
          cache-dependency-path: /tmp/cpa-baseline/go.sum
      - name: Full untouched upstream Go suite
        working-directory: /tmp/cpa-baseline
        run: |
          set -euxo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/validation-logs/go.log") 2>&1
          trap 'printf "%s\n" "$?" > "$GITHUB_WORKSPACE/validation-logs/go.exit"' EXIT
          go version
          go test -count=1 ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpa-baseline-${{ github.sha }}
          path: validation-logs/
          retention-days: 7
