[project]
name = "llm-auth-bridge"
version = "0.1.0"
description = "Single-admin account authentication and credential synchronization bridge"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "cryptography>=43,<44", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

