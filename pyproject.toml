[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-auth-bridge"
version = "0.2.0"
description = "Single-admin account authentication and credential synchronization bridge"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "cryptography==44.0.3", "argon2-cffi==23.1.0", "httpx==0.28.1", "websockets==15.0.1"]

[project.optional-dependencies]
browser = ["camoufox==0.5.8", "playwright==1.56.0", "pyotp==2.9.0"]
test = ["pytest==8.3.5", "pytest-xdist==3.8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
