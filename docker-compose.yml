services:
  app:
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    ports: ["${LLM_AUTH_BIND_HOST:-127.0.0.1}:8000:8000"]
    environment:
      LLM_AUTH_DB: /data/app.sqlite3
      LLM_AUTH_MASTER_KEY_FILE: /run/secrets/master_key
      LLM_AUTH_LOCK_FILE: /data/browser.lock
      LLM_AUTH_STORAGE_CHECK: ${LLM_AUTH_STORAGE_CHECK:-warn}
      LLM_AUTH_SECURE_COOKIE: ${LLM_AUTH_SECURE_COOKIE:-true}
      LLM_AUTH_TAKEOVER_URL: ws://worker:6080/websockify
    volumes:
      - app-data:/data
    secrets: [master_key]
    depends_on: [worker]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    security_opt: ["no-new-privileges:true"]
  worker:
    build:
      context: .
      target: worker
    init: true
    restart: unless-stopped
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3,time; c=sqlite3.connect(os.environ['LLM_AUTH_DB']); assert c.execute('SELECT 1 FROM runtime WHERE heartbeat>?',(time.time()-45,)).fetchone()"]
      interval: 30s
      timeout: 6s
      retries: 3
    environment:
      LLM_AUTH_DB: /data/app.sqlite3
      LLM_AUTH_MASTER_KEY_FILE: /run/secrets/master_key
      LLM_AUTH_LOCK_FILE: /data/browser.lock
      LLM_AUTH_STORAGE_CHECK: ${LLM_AUTH_STORAGE_CHECK:-warn}
      LLM_AUTH_SECURE_COOKIE: ${LLM_AUTH_SECURE_COOKIE:-true}
      DISPLAY: :99
    volumes:
      - app-data:/data
    secrets: [master_key]
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./deploy/playwright-seccomp.json"
secrets:
  master_key:
    file: .secrets/master_key
volumes:
  app-data:
